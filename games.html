<header class="page-head"><h1>遊戲中心</h1><p class="page-head__sub">逛展逛累了就來放鬆一下 —— 一整牆醫療主題的休閒小遊戲。全部在瀏覽器內執行,不上傳任何資料。</p><p class="page-head__sub">共 14 款小遊戲,挑一個來玩。</p></header><div class="arcade-filters" id="arcadeFilters"><button class="chip chip--active" data-cat="">全部</button><button class="chip" data-cat="反應力">反應力</button><button class="chip" data-cat="記憶">記憶</button><button class="chip" data-cat="知識">知識</button><button class="chip" data-cat="街機">街機</button><button class="chip" data-cat="益智">益智</button><button class="chip" data-cat="技巧">技巧</button><button class="chip" data-cat="紓壓">紓壓</button><button class="chip" data-cat="節奏">節奏</button><button class="chip" data-cat="速度">速度</button><button class="chip" data-cat="邏輯">邏輯</button></div><div class="arcade-grid" id="arcadeGrid"><button class="gcard" type="button" data-game="reaction" style="--gcard-accent:#B3261E"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">bolt</span></span><span class="gcard__cat">反應力</span><h3 class="gcard__title">急診反應力</h3><p class="gcard__tag">綠燈亮起就出手,測你的反應有多快。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="memory" style="--gcard-accent:#4B607C"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">style</span></span><span class="gcard__cat">記憶</span><h3 class="gcard__title">醫療記憶配對</h3><p class="gcard__tag">翻牌找出成對的醫療符號,用最少步數通關。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="whack" style="--gcard-accent:#2E7D32"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">pest_control</span></span><span class="gcard__cat">反應力</span><h3 class="gcard__title">病菌大作戰</h3><p class="gcard__tag">30 秒內消滅冒出來的病菌,小心別誤傷好細胞。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="quiz" style="--gcard-accent:#00696E"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">quiz</span></span><span class="gcard__cat">知識</span><h3 class="gcard__title">醫療知識問答</h3><p class="gcard__tag">10 題醫療常識與展會冷知識,看你能答對幾題。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="simon" style="--gcard-accent:#B3261E"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">favorite</span></span><span class="gcard__cat">記憶</span><h3 class="gcard__title">心律記憶</h3><p class="gcard__tag">記住閃動的節律順序並重現,序列會愈來愈長。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="sort" style="--gcard-accent:#6750A4"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">category</span></span><span class="gcard__cat">知識</span><h3 class="gcard__title">展區歸位挑戰</h3><p class="gcard__tag">把展品歸到正確的主題展區,跟時間賽跑。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="snake" style="--gcard-accent:#386A20"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">nutrition</span></span><span class="gcard__cat">街機</span><h3 class="gcard__title">養分貪食蛇</h3><p class="gcard__tag">吃下蔬果養分讓身體變長,別撞牆或咬到自己。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="cells2048" style="--gcard-accent:#8E4585"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">grid_view</span></span><span class="gcard__cat">益智</span><h3 class="gcard__title">細胞合成 2048</h3><p class="gcard__tag">滑動合併相同數字,挑戰湊出 2048。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="steady" style="--gcard-accent:#B5651D"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">back_hand</span></span><span class="gcard__cat">技巧</span><h3 class="gcard__title">妙手手術</h3><p class="gcard__tag">沿著通道把探針從起點移到終點,別碰到邊。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="breath" style="--gcard-accent:#4A6364"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">self_improvement</span></span><span class="gcard__cat">紓壓</span><h3 class="gcard__title">深呼吸放鬆</h3><p class="gcard__tag">跟著圓圈一吸一吐,做幾輪方塊呼吸放鬆一下。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="rhythm" style="--gcard-accent:#C2185B"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">ecg_heart</span></span><span class="gcard__cat">節奏</span><h3 class="gcard__title">心跳節拍</h3><p class="gcard__tag">跟著心跳節拍器準確點擊,愈準分數愈高。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="slidepuzzle" style="--gcard-accent:#1565C0"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">extension</span></span><span class="gcard__cat">益智</span><h3 class="gcard__title">滑塊拼圖</h3><p class="gcard__tag">滑動數字方塊復原順序,挑戰最少步數。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="typer" style="--gcard-accent:#00838F"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">keyboard</span></span><span class="gcard__cat">速度</span><h3 class="gcard__title">醫學名詞速打</h3><p class="gcard__tag">60 秒內盡量打對醫學名詞,測你的手速。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button><button class="gcard" type="button" data-game="guess" style="--gcard-accent:#455A64"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">search</span></span><span class="gcard__cat">邏輯</span><h3 class="gcard__title">生命徵象大搜查</h3><p class="gcard__tag">用二分法猜出隱藏的數值,步數越少越神。</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>開始玩</span></button></div><section class="arcade-stage" id="arcadeStage" hidden=""><div class="stage-bar"><button class="stage-back" id="stageBack" type="button"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span><span id="stageBackTxt">返回遊戲牆</span></button><h2 class="stage-title" id="stageTitle"></h2><span class="stage-cat" id="stageCat"></span></div><div class="game-host" id="gameHost"></div></section>
