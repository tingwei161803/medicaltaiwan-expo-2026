<header class="page-head"><h1>Games</h1><p class="page-head__sub">Take a break between booths — a collection of bite-size, medical-themed mini-games. Everything runs in your browser; nothing is uploaded.</p><p class="page-head__sub">14 mini-games — pick one and play.</p></header><div class="arcade-filters" id="arcadeFilters"><button class="chip chip--active" data-cat="">All</button><button class="chip" data-cat="Reflex">Reflex</button><button class="chip" data-cat="Memory">Memory</button><button class="chip" data-cat="Knowledge">Knowledge</button><button class="chip" data-cat="Arcade">Arcade</button><button class="chip" data-cat="Puzzle">Puzzle</button><button class="chip" data-cat="Skill">Skill</button><button class="chip" data-cat="Wellness">Wellness</button><button class="chip" data-cat="Rhythm">Rhythm</button><button class="chip" data-cat="Speed">Speed</button><button class="chip" data-cat="Logic">Logic</button></div><div class="arcade-grid" id="arcadeGrid"><button class="gcard" type="button" data-game="reaction" style="--gcard-accent:#B3261E"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">bolt</span></span><span class="gcard__cat">Reflex</span><h3 class="gcard__title">ER Reflex</h3><p class="gcard__tag">Tap the instant it turns green — how fast are you?</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="memory" style="--gcard-accent:#4B607C"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">style</span></span><span class="gcard__cat">Memory</span><h3 class="gcard__title">Medical Memory</h3><p class="gcard__tag">Flip cards to match medical icon pairs in the fewest moves.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="whack" style="--gcard-accent:#2E7D32"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">pest_control</span></span><span class="gcard__cat">Reflex</span><h3 class="gcard__title">Germ Buster</h3><p class="gcard__tag">Smash the germs in 30s — don't hit the good cells.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="quiz" style="--gcard-accent:#00696E"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">quiz</span></span><span class="gcard__cat">Knowledge</span><h3 class="gcard__title">Health Quiz</h3><p class="gcard__tag">10 medical-trivia questions — how many can you ace?</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="simon" style="--gcard-accent:#B3261E"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">favorite</span></span><span class="gcard__cat">Memory</span><h3 class="gcard__title">Heartbeat Memory</h3><p class="gcard__tag">Repeat the lighting sequence — it grows each round.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="sort" style="--gcard-accent:#6750A4"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">category</span></span><span class="gcard__cat">Knowledge</span><h3 class="gcard__title">Zone Sorter</h3><p class="gcard__tag">Drop each product into its right expo zone, against the clock.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="snake" style="--gcard-accent:#386A20"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">nutrition</span></span><span class="gcard__cat">Arcade</span><h3 class="gcard__title">Nutrient Snake</h3><p class="gcard__tag">Eat healthy nutrients to grow — don't hit a wall or yourself.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="cells2048" style="--gcard-accent:#8E4585"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">grid_view</span></span><span class="gcard__cat">Puzzle</span><h3 class="gcard__title">Cell Merge 2048</h3><p class="gcard__tag">Slide to merge equal tiles — reach 2048.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="steady" style="--gcard-accent:#B5651D"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">back_hand</span></span><span class="gcard__cat">Skill</span><h3 class="gcard__title">Steady Hand</h3><p class="gcard__tag">Guide the probe from start to finish without touching the walls.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="breath" style="--gcard-accent:#4A6364"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">self_improvement</span></span><span class="gcard__cat">Wellness</span><h3 class="gcard__title">Breathing Pacer</h3><p class="gcard__tag">Follow the circle through box-breathing to unwind.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="rhythm" style="--gcard-accent:#C2185B"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">ecg_heart</span></span><span class="gcard__cat">Rhythm</span><h3 class="gcard__title">Heartbeat Tap</h3><p class="gcard__tag">Tap on the beat — the closer to the pulse, the higher you score.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="slidepuzzle" style="--gcard-accent:#1565C0"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">extension</span></span><span class="gcard__cat">Puzzle</span><h3 class="gcard__title">Sliding Puzzle</h3><p class="gcard__tag">Slide the tiles back into order in as few moves as you can.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="typer" style="--gcard-accent:#00838F"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">keyboard</span></span><span class="gcard__cat">Speed</span><h3 class="gcard__title">Term Typer</h3><p class="gcard__tag">Type as many medical terms correctly as you can in 60s.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button><button class="gcard" type="button" data-game="guess" style="--gcard-accent:#455A64"><span class="gcard__icon"><span class="material-symbols-rounded" aria-hidden="true">search</span></span><span class="gcard__cat">Logic</span><h3 class="gcard__title">Vital Guess</h3><p class="gcard__tag">Home in on the hidden value — fewer guesses, higher rank.</p><span class="gcard__play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play</span></button></div><section class="arcade-stage" id="arcadeStage" hidden=""><div class="stage-bar"><button class="stage-back" id="stageBack" type="button"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span><span id="stageBackTxt">All games</span></button><h2 class="stage-title" id="stageTitle"></h2><span class="stage-cat" id="stageCat"></span></div><div class="game-host" id="gameHost"></div></section>
